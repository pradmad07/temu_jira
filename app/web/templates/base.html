<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>I-ITSM</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<nav class="navbar navbar-dark bg-dark px-3"><span class="navbar-brand">I-ITSM</span>
{% if user %}<div class="text-white small">{{ user.name }} ({{ user.role.value }})
 {% if user.can('incident.create') %}<a class="text-white ms-3" href="/employee/incidents">My incidents</a><a class="text-white ms-3" href="/employee/incidents/new">Report incident</a>{% endif %}
 <a class="text-white ms-3" href="/logout">Log out</a></div>{% endif %}</nav>
<main class="container py-4">{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}{% block body %}{% endblock %}</main></body></html>
